name: Build Smart Karaoke APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn về máy chủ ảo
      uses: actions/checkout@v4

    - name: Cài đặt môi trường Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cấp quyền thực thi cho Gradle
      run: chmod +x gradlew

    - name: Tiến hành Build file APK
      run: ./gradlew assembleDebug

    - name: Đóng gói file APK để tải về
      uses: actions/upload-artifact@v4
      with:
        name: SmartKaraokeTV-APK
        path: app/build/outputs/apk/debug/app-debug.apk
